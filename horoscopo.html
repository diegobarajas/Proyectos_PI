<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Signo Zodiacal</title>
</head>

<body>
    <h1>Mi signo Zodiacal</h1>

    <form action="recibe_formulario.html" method="POST" >

        <div class="mb-3">
        <label for="Nombre" class="form-label">
            Nombre:
        <input type="text" id="Nombre" name="Nombre" class="form-control">
        </label>
        </div>

        <div class="mb-3">
        <label for="Correo" class="form-label">
            Correo:
            <input type="email" id="Correo" name="Correo" class="form-control">
        </label>
        </div>

        <div class="mb-3">
        <label for="Fecha_de_nacimiento" class="form-label">
            Fecha de nacimiento:
            <input type="date" name="Fecha_de_nacimiento" class="form-control">
        </label>
        </div>

        <button type="submit">Enviar</button>

    </form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
